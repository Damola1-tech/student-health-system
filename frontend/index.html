<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EKSU Student Health Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a6b3c, #0d4a2a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #1a6b3c;
      font-size: 22px;
      font-weight: 700;
    }
    .logo p {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }
    .logo .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #999;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .tab.active {
      color: #1a6b3c;
      border-bottom: 2px solid #1a6b3c;
      margin-bottom: -2px;
    }
    .form { display: none; }
    .form.active { display: block; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: #1a6b3c; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a6b3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #145530; }
    .error {
      background: #fee;
      color: #c00;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .success {
      background: #efe;
      color: #1a6b3c;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="icon">🏥</div>
      <h1>EKSU Health Monitor</h1>
      <p>AI-Based Student Health Monitoring System</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="form active">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" />
      </div>
      <button class="btn" onclick="login()">Login</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create a password" />
      </div>
      <div class="form-group">
        <label>Level</label>
        <select id="regLevel">
          <option value="">Select Level</option>
          <option>100</option>
          <option>200</option>
          <option>300</option>
          <option>400</option>
          <option>500</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="regDept" placeholder="e.g. Computer Science" />
      </div>
      <button class="btn" onclick="register()">Create Account</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.getElementById(tab + 'Form').classList.add('active');
      event.target.classList.add('active');
      hideMessages();
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function hideMessages() {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showError('Please fill all fields');

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);

      localStorage.setItem('token', data.token);
      localStorage.setItem('fullname', data.fullname);
      window.location.href = '/dashboard.html';
    }

    async function register() {
      const fullname = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const level = document.getElementById('regLevel').value;
      const department = document.getElementById('regDept').value;

      if (!fullname || !email || !password) return showError('Please fill all required fields');

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullname, email, password, level, department })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);cd

      localStorage.setItem('token', data.token);
      localStorage.setItem('fullname', data.fullname);
      window.location.href = '/dashboard.html';
    }

    // If already logged in go straight to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
